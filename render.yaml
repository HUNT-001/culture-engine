services:
  - type: web
    name: common-thread-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -e ".[dev]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: MOCK_PROVIDERS
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
